name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Retry specific images.txt entries (one per line)'
        required: false
        type: string
      sync_all:
        description: 'Explicitly sync every image in images.txt'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select images to sync
      id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_SYNC_ALL: ${{ inputs.sync_all }}
        SELECTED_IMAGES_FILE: ${{ runner.temp }}/selected-images.txt
      shell: python
      run: |
        # BEGIN IMAGE SELECTION
        import os
        from pathlib import Path
        import subprocess

        def entries(text):
            return list(dict.fromkeys(
                ' '.join(line.split()) for line in text.splitlines()
                if line.strip() and not line.lstrip().startswith('#')
            ))

        current = entries(Path('images.txt').read_text())
        if os.environ['EVENT_NAME'] == 'push':
            before = os.environ['BEFORE_SHA']
            if before == '0' * 40:
                previous = []
            else:
                # An unavailable base must fail, never silently sync everything.
                subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], check=True)
                files = subprocess.check_output(
                    ['git', 'ls-tree', '--name-only', before, '--', 'images.txt'], text=True
                ).splitlines()
                previous = entries(subprocess.check_output(
                    ['git', 'show', before + ':images.txt'], text=True
                )) if 'images.txt' in files else []
            previous = set(previous)
            selected = [line for line in current if line not in previous]
        elif os.environ['EVENT_NAME'] == 'workflow_dispatch':
            requested = entries(os.environ.get('INPUT_IMAGES', ''))
            full = os.environ.get('INPUT_SYNC_ALL', '').lower() == 'true'
            if full and requested:
                raise SystemExit('Choose specific images OR sync_all, not both.')
            if full:
                selected = current
            elif requested:
                unknown = [line for line in requested if line not in current]
                if unknown:
                    raise SystemExit('Requested entry is not in images.txt: ' + ', '.join(unknown))
                selected = requested
            else:
                raise SystemExit('Specify images to retry, or explicitly enable sync_all.')
        else:
            raise SystemExit('Unsupported event: ' + os.environ['EVENT_NAME'])

        Path(os.environ['SELECTED_IMAGES_FILE']).write_text(
            ''.join(line + '\n' for line in selected)
        )
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'count={len(selected)}\n')
        print(f'Selected {len(selected)} image(s):')
        for line in selected:
            print(line)
        # END IMAGE SELECTION

    - name: Free disk space for selected images
      if: steps.select.outputs.count != '0'
      run: |
        df -hT
        # Keep free space on root for both Docker and containerd image stores.
        # Avoid deleting SDKs when the runner already has at least 20 GiB free.
        available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
        if (( available_kb < 20 * 1024 * 1024 )); then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
        fi
        df -hT

    - name: Docker Setup Buildx
      if: steps.select.outputs.count != '0'
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      if: steps.select.outputs.count != '0'
      env:
        SELECTED_IMAGES_FILE: ${{ runner.temp }}/selected-images.txt
      run: |
        printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login --username "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            echo "docker pull $line"
            docker pull $line
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            docker push $new_image
            echo "::group::Verify pushed manifest"
            docker image inspect "$image" --format '{{.Os}}/{{.Architecture}} image_id={{.Id}}'
            docker buildx imagetools inspect "$new_image"
            docker buildx imagetools inspect "$new_image" --raw
            echo "::endgroup::"
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi $image
            docker rmi $new_image
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="     
            
        done < "$SELECTED_IMAGES_FILE"
