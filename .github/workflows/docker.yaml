name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Optional: check specific images.txt entries (one per line)'
        required: false
        type: string
      sync_all:
        description: 'Force re-sync ALL images, including existing ACR tags'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Test registry selection
      run: python3 -m unittest discover -s .github/tests -v

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Aliyun ACR
      run: |
        printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login --username "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

    - name: Select missing images in ACR
      id: select
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_SYNC_ALL: ${{ inputs.sync_all }}
        SELECTED_IMAGES_FILE: ${{ runner.temp }}/selected-images.tsv
      run: python3 .github/scripts/select_missing_images.py

    - name: Free disk space for selected images
      if: steps.select.outputs.count != '0'
      run: |
        df -hT
        # Keep space on root for Docker and containerd. Clean only when needed.
        available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
        if (( available_kb < 20 * 1024 * 1024 )); then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
        fi
        df -hT

    - name: Build and push image Aliyun
      if: steps.select.outputs.count != '0'
      env:
        SELECTED_IMAGES_FILE: ${{ runner.temp }}/selected-images.tsv
      run: |
        while IFS=$'\t' read -r line new_image || [ -n "$line" ]; do
          # The planner supplies the exact same destination it checked in ACR.
          read -r -a pull_args <<< "$line"
          image="${pull_args[${#pull_args[@]}-1]}"
          echo "docker pull $line"
          docker pull "${pull_args[@]}"
          docker tag "$image" "$new_image"
          docker push "$new_image"
          echo "::group::Verify pushed manifest"
          docker image inspect "$image" --format '{{.Os}}/{{.Architecture}} image_id={{.Id}}'
          docker buildx imagetools inspect "$new_image"
          docker buildx imagetools inspect "$new_image" --raw
          echo "::endgroup::"
          docker rmi "$image"
          docker rmi "$new_image"
          df -hT
        done < "$SELECTED_IMAGES_FILE"
