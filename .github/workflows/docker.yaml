name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Optional: check specific images.txt entries (one per line)'
        required: false
        type: string
      sync_all:
        description: 'Force re-sync ALL images, even when platform digests match'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Test registry selection
      run: python3 -m unittest discover -s .github/tests -v

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Aliyun ACR
      run: |
        printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login --username "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

    - name: Compare source and ACR platform digests
      id: select
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_SYNC_ALL: ${{ inputs.sync_all }}
        SYNC_PLAN_FILE: ${{ runner.temp }}/sync-plan.json
      run: python3 .github/scripts/select_missing_images.py --compare-digests

    - name: Install Skopeo for digest-preserving copy
      if: steps.select.outputs.count != '0'
      run: |
        if ! command -v skopeo >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
        fi
        skopeo --version

    - name: Copy changed images and verify ACR digests
      if: steps.select.outputs.count != '0'
      env:
        SYNC_PLAN_FILE: ${{ runner.temp }}/sync-plan.json
      run: python3 .github/scripts/select_missing_images.py --sync-plan
